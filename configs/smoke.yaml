# Smoke configuration: small enough to run in a couple of minutes on a laptop.
#
# Same code path as configs/default.yaml, with the subcircuit and trial budget
# shrunk. Used by `flyread selftest` and by the fast tests. NOT a source of
# reported numbers.
#
#   flyread --config configs/smoke.yaml selftest

simulation:
  dt: 0.5

subcircuit:
  candidate: smoke
  stages:
    - name: photoreceptor
      rules:
        - {column: cell_class, equals: visual}
        - {column: cell_type, equals: R1-6}
      cap: 36
    - name: lamina
      # `LA>ME` (8035 neurons) alone leaves the chain badly under-connected:
      # only 9 `visual` neurons send anything to it. `ME>LA` (4979 neurons) is
      # the other medulla-to-lamina projection and is included so a connected
      # chain can actually be grown. Both are genuine lamina cell types.
      rules:
        - {column: cell_class, in: ["LA>ME", "ME>LA"]}
      cap: 24
    - name: medulla
      rules:
        - {column: cell_class, equals: "ME"}
      cap: 24
    - name: lobula
      # Every LO* class, not just three exact ones. Restricting to
      # LO / LO>LOP / LOP left the medulla -> lobula link with ZERO connected
      # candidates, so the lobula had no real visual input at all and the
      # synthetic bridge silently covered for it. The broader rule matches the
      # 149195 medulla -> lobula synapses present in the annotation.
      rules:
        - {column: cell_class, startswith: "LO"}
      cap: 12
    - name: reinforcement
      rules:
        - {column: cell_class, equals: MBIN}
      cap: 4
    - name: mushroom_body
      rules:
        - {column: cell_class, equals: Kenyon_Cell}
      cap: 24
    - name: output
      rules:
        - {column: cell_class, equals: MBON}
      cap: 4

network:
  reserve_size: 6
  reward_tau_ms: 60.0
  background_dc_na: 0.05
  pair_weight_normalisation: fan_in_total
  mushroom_body_recurrent:
    weight_ratio: 0.001
  artificial_bridge:
    weight_ratio: 0.001
  artificial_readout:
    weight_ratio: 0.3
  output_recurrent:
    weight_ratio: 0.0
  short_term_depression:
    enabled: false

calibration:
  scale_grid: [10.0, 25.0, 50.0, 100.0, 200.0, 350.0, 500.0, 700.0, 1000.0]
  simulated_ms: 100.0
  settle_ms: 20.0

encoding:
  grid_rows: 6
  grid_cols: 6
  stimulus_ms: 300.0
  rest_ms: 150.0

evaluation:
  train_per_category: 15
  test_per_category: 5
  n_seeds: 3
  n_train_trials: 40
  curve_window_trials: 10
  eval_repeats: 1
  ci_resamples: 200

structural:
  check_every_n_trials: 10
  prune_consecutive_checks: 1
  silence_window_trials: 10

benchmark:
  simulated_ms: 100.0
  settle_ms: 20.0

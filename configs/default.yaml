# flyread default configuration.
#
# Every value here can be overridden with `--config file.yaml` or
# `--set section.key=value`. The effective configuration is copied into every
# run manifest. Units are given in each key's comment; Brian2 accepts plain
# numbers for times (interpreted as ms) and so does this file.

run:
  # Root for all run outputs. Each run writes <output_dir>/<run_id>/
  output_dir: runs
  # Leave empty to derive a timestamped id; set for reproducible directories.
  run_id: ""
  # Tolerance for the same-seed determinism check, in accuracy fraction.
  determinism_tolerance: 1.0e-9
  log_level: INFO

simulation:
  # Integration step. Brian2 reads plain numbers as ms.
  dt: 0.1
  # Brian2 code generation target: auto prefers Cython and falls back to numpy.
  codegen_target: auto

data:
  # FlyWire release identifier recorded in every manifest.
  release: "783"
  # Directory holding the downloaded FlyWire files. Never committed.
  flywire_dir: data/flywire
  # Dataset of 4-letter words.
  words_csv: data/words.csv

# Checksums are verified before the loader builds anything. `null` disables the
# check for that file and is recorded in the manifest as an explicit warning.
connectome:
  annotations_file: data/flywire/Supplemental_file1_neuron_annotations.tsv
  connections_file: data/flywire/proofread_connections_783.feather
  annotations_md5: fd4fcb205256ca2f80a2eca3a0cc5d87
  connections_md5: f48f972d262323a102aed49af1396b8a
  # Set true only for local iteration; disables the required-column check.
  allow_missing_columns: false
  # Required columns, verified against the real files. Annotation columns come
  # from Supplemental_file1_neuron_annotations.tsv; connection columns from
  # proofread_connections_783.feather (one row per pre/post neuron pair and
  # neuropil, with average predicted transmitter scores per connection).
  required_neuron_columns: [root_id, flow, super_class, cell_class, cell_sub_class, cell_type, top_nt, side]
  required_connection_columns: [pre_pt_root_id, post_pt_root_id, neuropil, syn_count, ach_avg, glut_avg, gaba_avg]
  # Minimum synapses for a neuron pair to become a simulated connection.
  min_synapses: 1
  # Columns holding the average predicted transmitter score per connection.
  # The largest of these is the dominant transmitter for that connection.
  connection_nt_columns:
    acetylcholine: ach_avg
    glutamate: glut_avg
    gaba: gaba_avg
    octopamine: oct_avg
    serotonin: ser_avg
    dopamine: da_avg
  # Neurotransmitter -> sign. Configurable per the connectome-loading spec.
  # v1 simplification: glutamate is excitatory.
  neurotransmitter_signs:
    acetylcholine: 1
    glutamate: 1
    gaba: -1
    dopamine: -1
    serotonin: -1
    octopamine: -1
    histamine: -1
  # Applied when the dominant transmitter is absent or not in the map above.
  unknown_sign: 0
  warn_on_unknown_neurotransmitter: true

# Subcircuit extraction. Roles come from annotation fields, never hard-coded
# neuron IDs. `rules` is a list of {column, equals|contains|in|startswith, value}
# tests, ANDed within a stage.
#
# `stages` is an ordered list in signal order. Each stage is capped after
# ranking its candidates by the synapses they receive from the previously
# selected stage, so every stage stays populated and the chain is not
# truncated. Stage names that appear in `encoding.roles` / learning rules are
# used as role labels downstream.
#
# cell_class values are the real FlyWire abbreviations: LA = lamina, ME =
# medulla, LO = lobula, LOP = lobula plate; a ">" suffix names the neuron's
# axonal projection (e.g. LA>ME = lamina projection neurons L1-L5).
subcircuit:
  candidate: medium
  stages:
    - name: photoreceptor
      rules:
        - {column: cell_class, equals: visual}
        - {column: cell_type, equals: R1-6}
      cap: 576
    - name: lamina
      rules:
        # `LA>ME` (8035 neurons) alone leaves the chain badly
        # under-connected: only 9 `visual` neurons send anything to it.
        # `ME>LA` (4979 neurons) is the other medulla-to-lamina
        # projection; both are genuine lamina cell types.
        - {column: cell_class, in: ["LA>ME", "ME>LA"]}
      cap: 384
    - name: medulla
      rules:
        - {column: cell_class, equals: "ME"}
      cap: 384
    - name: lobula
      rules:
        # Every LO* class, not three exact ones: restricting to
        # LO / LO>LOP / LOP left medulla -> lobula with ZERO connected
        # candidates. The broader rule matches the 149195 medulla ->
        # lobula synapses present in the annotation.
        - {column: cell_class, startswith: "LO"}
      cap: 192
    # Real reinforcement/peduncle neurons: 2x APL (GABA) and 2x DPM
    # (dopamine) in release 783. These supply the teaching signal. Placed
    # before mushroom_body so their real MBIN->Kenyon-cell edges are
    # retained as an adjacent stage pair.
    - name: reinforcement
      rules:
        - {column: cell_class, equals: MBIN}
      cap: 4
    - name: mushroom_body
      rules:
        - {column: cell_class, equals: Kenyon_Cell}
      cap: 384
    - name: output
      rules:
        - {column: cell_class, equals: MBON}
      cap: 4
  # Exclude neurons flagged as segmentation or biology outliers.
  exclude_outliers: true
  # Backward seeding. Ranking every stage by input from the PREVIOUS stage
  # does not guarantee the chain reaches the end: the medulla neurons chosen
  # that way send no synapses to the top-ranked lobula candidates, so the
  # lobula ends up with zero in-edges and the artificial lobula -> Kenyon-cell
  # bridge carries no visual signal. `stage` is therefore seeded from the
  # `source` CANDIDATE pool, and `source` is then forced to be neurons that
  # actually project to it. Both selections stay real FlyWire connectivity.
  selection:
    # Seed the whole visual chain BACKWARD from the lobula. Ranking each
    # stage by input from the previous stage does not guarantee the chain
    # reaches the end: on release 783 the medulla neurons chosen that way
    # project to none of the top-ranked lobula candidates, so the lobula ended
    # up with zero in-edges and the artificial lobula -> Kenyon-cell bridge
    # carried no visual signal (the manifest's own reachability block reported
    # `signal_reaches_outputs: false`). Seeding `lobula` from the medulla
    # candidate pool, then each earlier stage by what it sends to the stage
    # already seeded, keeps every edge real. Listed in signal order.
    backward_chain: [photoreceptor, lamina, medulla, lobula]
    # Choose the output neurons so their incoming mushroom_body drive is
    # comparable. Ranking them by input strength alone selects the most
    # strongly driven MBON neurons, which on release 783 produced a 248:1
    # spread in total plastic drive; one neuron then won every argmax, every
    # trial was punished, and dopamine decayed all weights uniformly. The
    # edges stay real; only which real readouts are used changes.
    balance_outputs: true
    # A readout with a single plastic synapse saturates on one presynaptic
    # spike, so it can only ever win or never fire. Require a workable
    # minimum of mushroom_body input before balancing.
    min_plastic_input: 3
    # Cap on how much Kenyon-cell input two readouts may share. Two MBON
    # neurons fed by the same Kenyon cells can never respond differently; a
    # balance-only rule selected such a pair (Jaccard 1.00) and left the
    # output flat for every word. Only the choice among real MBON neurons
    # changes; no edge is synthesised.
    max_readout_overlap: 0.5
  # Restrict the subcircuit to one hemisphere to halve the size. "" disables.
  restrict_side: ""
  # Max path length (in hops) used to verify photoreceptor -> output reachability.
  max_path_hops: 8
  # ARTIFICIAL COMPONENT. Kenyon cells receive no optic-lobe input in
  # FlyWire release 783 (measured: 1 synapse from lobula, 2 from medulla),
  # because the mushroom body is not a visual target in Drosophila. To keep the
  # word -> mushroom body -> output pathway the experiment requires, one
  # artificial lobula -> Kenyon cell synapse set is synthesised.
  #
  # This is NOT FlyWire connectivity and must never be reported as such. It is
  # flagged `artificial` on every edge, counted in the manifest, and printed in
  # the report. Source lobula neurons are chosen by REAL incoming strength from
  # the selected upstream stages, so the bridge inherits real connectivity
  # structure; only the synapse counts and signs are synthetic.
  bridge:
    enabled: true
    # Synapses each Kenyon cell receives from the bridge. Kept small and sparse
    # so the bridge cannot bypass the optic-lobe computation.
    synapses_per_kc: 6
    # Only the top-N lobula neurons by real upstream strength may bridge.
    max_sources: 192
    # Synthetic sign of bridge synapses.
    sign: 1
    # Seed for the per-Kenyon-cell sparse source draw. Recorded in the run
    # manifest so any run can be reproduced exactly.
    seed: 20240917
    # Weight applied to bridge synapses before the global calibration scale.
    weight: 1.0
  # SYNTHETIC dense mushroom_body -> output readout.
  #
  # Measured gap: the selected subcircuit has only 8 mushroom_body -> output
  # edges, drawn from 7 distinct Kenyon cells out of 24, so 17 Kenyon cells
  # have no route to the readout and it is measurably degenerate -- one output
  # neuron won all 20 held-out words while another fired exactly 71 spikes on
  # every word regardless of stimulus. As with the lobula bridge, the release
  # cannot express a visual mushroom-body readout, so this dense seeded set
  # closes the gap and is flagged synthetic in every manifest.
  readout:
    enabled: true
    # Kenyon cells projecting to each output neuron, drawn without replacement
    # per output neuron from the selected Kenyon cells.
    sources_per_output: 12
    # Synthetic sign of readout synapses.
    sign: 1
    # Synapses per source -> output pair.
    weight: 1.0
    # Seed for the per-output-neuron source draw.
    seed: 20240918

network:
  # Number of output neurons. Must equal encoding.n_categories.
  n_outputs: 4
  # Reserve pool of neurons born silent and unconnected (see structural spec).
  reserve_size: 48
  # Populations used as templates/recruitment targets, by role.
  lif:
    tau_ms: 20.0
    # Synaptic current decay. Required: without a decay equation on I_syn the
    # synaptic current integrates without bound and pins every neuron
    # hyperpolarized, so the network can never fire.
    tau_syn_ms: 5.0
    v_threshold: 1.0
    v_reset: 0.0
    v_rest: 0.0
    refractory_ms: 2.0
    t_init_ms: 50.0
  # SYNTHETIC. Each synapse carries a release probability `u` that starts at 1,
  # is decremented by `use` on every presynaptic spike, and recovers toward 1
  # with time constant `tau_ms`; the delivered current is w * u. Without it the
  # network is bistable -- silent below weight_scale ~1, and above ~2 it latches
  # into a fixed attractor that ignores the input. Measured with it disabled,
  # all 20 held-out words produced the bit-identical output vector [46,4,32,5].
  # FlyWire synapse counts carry no short-term plasticity, so this is declared
  # as synthetic and recorded in every run manifest rather than presented as
  # measured wiring.
  short_term_depression:
    # Implemented and available, but OFF by default because it measurably HURTS
    # the thing it was added to fix: with it on, lamina word-discrimination fell
    # from 8-9 distinct response patterns to 1-3. The bistability it was meant
    # to break is instead handled by the per-pair weight ratios above.
    enabled: false
    tau_ms: 50.0
    use: 0.3
    floor: 0.15
  # SYNTHETIC. Multiplier applied to `weight_scale` for the artificial
  # lobula -> mushroom_body bridge only. The bridge is not measured wiring, so
  # its strength is a declared free parameter. It is decoupled from the visual
  # chain because the chain needs a far larger `weight_scale` than the bridge
  # tolerates: at a shared scale the bridge saturates the mushroom body
  # (~3471 spikes per 300 ms word), which drives `reinforcement` hard, and the
  # 7-of-8 inhibitory reinforcement -> output edges then clamp the readout
  # completely silent.
  artificial_bridge:
    weight_ratio: 0.002
  # SYNTHETIC, same class of gap as `subcircuit.bridge` above: the selected
  # subcircuit has only 8 mushroom_body -> output edges drawing on 7 distinct
  # Kenyon cells out of 24, so 17 Kenyon cells have no path to the readout and
  # the measured readout is degenerate (one output neuron won all 20 held-out
  # words; another fired exactly 71 spikes on every word). Declared separately
  # because it tunes a different pair than the lobula bridge.
  artificial_readout:
    # Dense synthetic MB->output readout. Nested-CV accuracy of the
    # 4-neuron output vector over all 80 words, against 0.25 chance:
    #   0.01 -> 0.100 (silent)  0.03 -> 0.188  0.04 -> 0.200
    #   0.10 -> 0.225           0.30 -> 0.212  1.00 -> 0.138 (saturated)
    # 0.05 is the graded optimum: 0.338 (27/80), binomial p=0.0499, against a
    # mushroom_body ceiling of 0.388 (31/80, p=0.0046).
    weight_ratio: 0.05
  # A 46-synapse EXCITATORY self-connection inside the output stage latches
  # the readout: output neurons 0 and 2 measured ~122 spikes per 300 ms word
  # with sd 0.0-0.5, insensitive both to the stimulus and to a 20x reduction in
  # readout drive, so one of them won all 20 held-out words. A self-exciting
  # measurement device cannot report its own input.
  output_recurrent:
    weight_ratio: 0.0
  # Measured runaway: all 116 mushroom_body -> mushroom_body edges are
  # excitatory, and the compartment saturates at ~3500 spikes per 300 ms word
  # at every `weight_scale` tried, independent of the bridge strength. A
  # self-exciting compartment that runs away carries no information about its
  # input, so its drive is a declared free parameter.
  mushroom_body_recurrent:
    weight_ratio: 0.0001
  # Photoreceptor drive current per unit firing rate, in nA.
  input_gain_na: 0.002
  # Baseline input current for photoreceptors, in nA.
  input_baseline_na: 0.0
  # Poisson background drive. A deterministic feedforward LIF chain is exactly
  # quiescent without a stimulus, so spontaneous firing needs an explicit
  # source. This is DECLARED NOISE, not measured FlyWire connectivity.
  noise:
    enabled: true
    rate_hz: 20.0
    weight: 0.9
  # Subthreshold background drive for every neuron, in the same units as
  # v_threshold (1.0). A deterministic LIF network at rest is exactly silent,
  # so calibration's nonzero lower rate bound can never be met without it.
  # Keep it below v_threshold: spontaneous activity should arise from real
  # recurrent connectivity, not from injected noise.
  background_dc_na: 0.0
  # Generic per-stage-pair gain, keyed "<pre>><post>", applied on top of any
  # special-cased pair above. The measured optic-lobe pairs cannot share one
  # scale: photoreceptor->lamina saturates at the refractory limit and destroys
  # label information that is still decodable at the photoreceptor.
  pair_gain:
    photoreceptor>lamina: 1.0
    lamina>lamina: 1.0
    medulla>medulla: 1.0
    lobula>lobula: 1.0
  # How raw synapse counts become synaptic weights. Raw counts are not
  # comparable across stage pairs: mushroom_body -> reinforcement averages 29
  # synapses per edge, reinforcement -> mushroom_body averages 0.5, so that
  # single excitatory feedback loop is ~58x stronger than its return path. The
  # network is then bistable (exactly 0 Hz below threshold, 125-440 Hz above)
  # and NO weight scale can reach the calibration band. Normalising by each
  # pair's mean synapse count makes `weight_scale` mean the same thing
  # everywhere, so loop gain follows edge counts instead of synapse counts.
  pair_weight_normalisation: fan_in_total
  # Reward signal injected into the real reinforcement stage. The reward VALUE
  # is synthetic; the neurons receiving it (APL/DPM) and their real synapses
  # onto Kenyon cells are genuine FlyWire neurons and connections.
  reward_gain_na: 120.0
  punishment_gain_na: 120.0
  # Time constant of the injected reward current, in ms.
  reward_tau_ms: 120.0

# Calibration (no external stimulus). The global weight scale is searched so
# spontaneous firing sits inside the acceptable band without saturating.
calibration:
  enabled: true
  # Global multiplier searched over `scale_grid`.
  scale_grid: [10.0, 25.0, 50.0, 100.0, 200.0, 350.0, 500.0, 700.0, 1000.0, 1500.0]
  # A candidate is rejected unless its strongest edge can drive a postsynaptic
  # neuron from a single spike, which for this cell means an edge of at least
  # 6.35 nA (see network.transmission_weight). Without this, the 0.5-15 Hz band
  # is satisfied by a silent network: the photoreceptor fired at 136 Hz while
  # the lamina below it reached 0.7 Hz and no downstream stage fired at all.
  # Drive parameters searched jointly with `scale_grid`. An empty list means
  # "use the value from `network` unchanged". These are searched because with
  # the LIF sign convention corrected the network is bistable in `scale_grid`
  # alone: `background_dc_na` sets how far below threshold every population
  # sits, and the injected noise weight sets the resulting spontaneous rate.
  # Without them no scale lands in the 0.5-15 Hz band, because the transition
  # from fully silent to saturated happens inside one grid step.
  # `background_dc_grid` and `noise_weight_grid` are in CURRENT units, and
  # with a restoring leak a neuron reaches `v_threshold` only when the
  # drive exceeds `v_threshold / tau` = 1.0/0.02 = 50 nA. Grids in the
  # sub-1 range could never reach threshold and calibration rejected
  # every candidate.
  background_dc_grid: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
  noise_weight_grid: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
  simulated_ms: 300.0
  # Settling time excluded from the measurement, in ms.
  settle_ms: 50.0
  min_mean_rate_hz: 0.5
  max_mean_rate_hz: 15.0
  # Fraction of neurons allowed to fire continuously (>= 1 spike per tau).
  max_continuous_fraction: 0.02
  # Reject scales whose drift exceeds this, in Hz.
  max_rate_drift_hz: 5.0

encoding:
  # Pixel grid the rendered word is resampled onto. Must match the number of
  # simulated photoreceptors, or the loader will error.
  grid_rows: 24
  grid_cols: 24
  # Mapping scheme id, recorded in the manifest.
  scheme_id: grid-v1
  # Bundled font, relative to the package assets directory. Its sha256 is
  # recorded in the manifest and checked when `verify_font` is true.
  font_file: DejaVuSansMono.ttf
  font_sha256: 602ec86b8948cfcd956482fe64f94c36c867770149ef2f791d4613f443bcecb3
  verify_font: true
  font_size_px: 64
  letter_spacing_px: 8
  image_size_px: [128, 128]
  # Learning target.
  #
  # `category` is the original semantic axis (animal / food / tool / place) and
  # was MEASURED TO BE UNLEARNABLE from rendered words: supervised logistic
  # regression on 60 training words scored 0.20-0.35 on 20 held-out words
  # (chance 0.25) at 6x6, 16x16 and 32x32, and nearest-centroid scored 0.100.
  # Words in a category are no more visually alike than words across
  # categories, so the structure is absent from the stimulus itself.
  #
  # `ink_quartile` labels each word by total ink (label 0 lightest quarter,
  # label 3 darkest). It is a global property, so it requires spatial
  # integration rather than reading one photoreceptor, and the same regression
  # scores 0.50-0.70 held-out at every resolution tried.
  label_mode: ink_quartile
  # Darkness -> firing rate. rate_hz = baseline_hz + span_hz * darkness.
  #
  # baseline_hz MUST be 0: any positive baseline rate is converted to a current
  # by inverting the LIF rate-current relation, and 2 Hz maps to exactly the
  # threshold current (50 nA, since v_inf = I*tau_mem = 1.0 = v_threshold).
  # Every blank pixel therefore sat precisely at threshold and the retina
  # responded almost identically to every word (329-334 spikes, between-word
  # std ~1). With baseline_hz = 0 a blank pixel is silent and the same words
  # produce 160-198 spikes across 15 distinct totals.
  baseline_hz: 0.0
  max_hz: 120.0
  # Encoded rates are converted to input current by inverting the LIF
  # rate-current relation for the configured cell (see encoding.rate_to_current),
  # so no fixed nA/Hz gain is needed. The old scalar gain of 0.002 nA/Hz was
  # roughly 600x too weak to bring a photoreceptor to threshold.
  # Presentation timing, in ms.
  stimulus_ms: 300.0
  rest_ms: 200.0
  # Randomly permute pixel->photoreceptor assignments (control condition).
  shuffle_pixels: false
  # Seed for the permutation; defaults to the run seed when null.
  shuffle_seed: null
  # Category labels, in the fixed order used for output neuron indices.
  categories: [animal, food, tool, place]

learning:
  # Dopamine-gated three-factor rule at Kenyon cell -> output synapses.
  enabled: true
  learning_rate: 0.02
  # Eligibility trace: increases on pre/post coincidence, decays with tau.
  trace_tau_ms: 400.0
  # Trace gain per coincident pre/post pair event.
  trace_increment: 0.02
  # Reward/punishment magnitudes delivered after each trial.
  reward: 1.0
  punishment: -1.0
  w_min: 0.0
  w_max: 1.0
  # Bounds are applied as RATIOS of the initial plastic weight, not as
  # absolute values. The plastic mushroom_body -> output synapse is initialised
  # to `weight_scale` (measured 500 in the calibrated operating regime), so
  # absolute bounds of 0..1 clipped the readout drive down ~500x on the first
  # dopamine update and left the range far too weak to matter. Set
  # `relative_bounds: false` to use w_min/w_max above instead.
  relative_bounds: true
  w_min_ratio: 0.0
  w_max_ratio: 2.0
  # Only these pathways are plastic.
  plastic_roles: [mushroom_body_output]
  # Synapse-level weight noise, dimensionless.
  weight_noise: 0.0

structural:
  # Master ablation switch.
  enabled: true
  # Run the structural step every N trials.
  check_every_n_trials: 25
  # Pruning: weight below threshold for N consecutive checks.
  prune_weight_threshold: 0.01
  prune_consecutive_checks: 2
  # Silencing: mean rate below threshold (Hz) over a window of trials.
  silence_rate_threshold_hz: 0.1
  silence_window_trials: 50
  # Recruitment: how often to attempt growth, and how much to clone.
  recruit_every_n_checks: 4
  recruit_weight_fraction: 0.2
  recruit_noise: 0.05
  # Rate limits.
  max_prunes_per_interval: 64
  max_silences_per_interval: 8
  max_recruits_per_interval: 4
  # Total fraction of the plastic pathway that may be pruned or silenced.
  max_total_fraction_pruned: 0.5
  max_total_fraction_silenced: 0.25
  # Roles eligible for structural change.
  plasticity_roles: [mushroom_body, output]

evaluation:
  # Train/test split per category, out of 20 words each.
  train_per_category: 15
  test_per_category: 5
  # Conditions reported in the final table.
  conditions:
    - untrained
    - trained
    - shuffled_labels
    - dopamine_off
    - shuffled_pixels
    - structural_on
    - structural_off
  chance_level: 0.25
  # Number of independent seeds. Minimum 10 per the evaluation spec.
  n_seeds: 10
  base_seed: 1000
  # Two-sided significance level for the one-sample test against chance.
  significance_level: 0.01
  # Bootstrap resamples for the confidence interval.
  ci_resamples: 10000
  ci_level: 0.95
  # Training trials per seed.
  n_train_trials: 600
  # Trials per learning-curve window.
  curve_window_trials: 50
  # Held-out evaluation repetitions per word, to reduce response noise.
  eval_repeats: 3
  # Raise a data-leakage warning when shuffled labels beat chance by this much.
  leakage_margin: 0.05

benchmark:
  # Task 0 feasibility gate.
  simulated_ms: 500.0
  settle_ms: 50.0
  # Wall-clock budget for the whole multi-seed experiment, in minutes.
  wall_clock_limit_min: 120.0
  # Fail the gate if peak memory exceeds this fraction of the memory budget.
  memory_headroom: 0.8

resources:
  # Hard memory budget for loading + building the subcircuit, in MB.
  memory_budget_mb: 4096
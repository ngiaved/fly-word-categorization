# flyread default configuration.
#
# Every value here can be overridden with `--config file.yaml` or
# `--set section.key=value`. The effective configuration is copied into every
# run manifest. Units are given in each key's comment; Brian2 accepts plain
# numbers for times (interpreted as ms) and so does this file.

run:
  # Root for all run outputs. Each run writes <output_dir>/<run_id>/
  output_dir: runs
  # Leave empty to derive a timestamped id; set for reproducible directories.
  run_id: ""
  # Tolerance for the same-seed determinism check, in accuracy fraction.
  determinism_tolerance: 1.0e-9
  log_level: INFO

simulation:
  # Integration step. Brian2 reads plain numbers as ms.
  dt: 0.1
  # Brian2 code generation target: auto prefers Cython and falls back to numpy.
  codegen_target: auto

data:
  # FlyWire release identifier recorded in every manifest.
  release: "783"
  # Directory holding the downloaded FlyWire files. Never committed.
  flywire_dir: data/flywire
  # Dataset of 4-letter words.
  words_csv: data/words.csv

# Checksums are verified before the loader builds anything. `null` disables the
# check for that file and is recorded in the manifest as an explicit warning.
connectome:
  annotations_file: data/flywire/Supplemental_file1_neuron_annotations.tsv
  connections_file: data/flywire/proofread_connections_783.feather
  annotations_md5: fd4fcb205256ca2f80a2eca3a0cc5d87
  connections_md5: f48f972d262323a102aed49af1396b8a
  # Set true only for local iteration; disables the required-column check.
  allow_missing_columns: false
  # Required columns, verified against the real files. Annotation columns come
  # from Supplemental_file1_neuron_annotations.tsv; connection columns from
  # proofread_connections_783.feather (one row per pre/post neuron pair and
  # neuropil, with average predicted transmitter scores per connection).
  required_neuron_columns: [root_id, flow, super_class, cell_class, cell_sub_class, cell_type, top_nt, side]
  required_connection_columns: [pre_pt_root_id, post_pt_root_id, neuropil, syn_count, ach_avg, glut_avg, gaba_avg]
  # Minimum synapses for a neuron pair to become a simulated connection.
  min_synapses: 1
  # Columns holding the average predicted transmitter score per connection.
  # The largest of these is the dominant transmitter for that connection.
  connection_nt_columns:
    acetylcholine: ach_avg
    glutamate: glut_avg
    gaba: gaba_avg
    octopamine: oct_avg
    serotonin: ser_avg
    dopamine: da_avg
  # Neurotransmitter -> sign. Configurable per the connectome-loading spec.
  # v1 simplification: glutamate is excitatory.
  neurotransmitter_signs:
    acetylcholine: 1
    glutamate: 1
    gaba: -1
    dopamine: -1
    serotonin: -1
    octopamine: -1
    histamine: -1
  # Applied when the dominant transmitter is absent or not in the map above.
  unknown_sign: 0
  warn_on_unknown_neurotransmitter: true

# Subcircuit extraction. Roles come from annotation fields, never hard-coded
# neuron IDs. `rules` is a list of {column, equals|contains|in|startswith, value}
# tests, ANDed within a stage.
#
# `stages` is an ordered list in signal order; the FIRST stage is the input
# layer, whatever its name (`photoreceptor` in the visual chain, `olfactory`
# here). Each stage is capped after ranking its candidates by the synapses they
# receive from the previously selected stages, so every stage stays populated
# and the chain is not truncated. Stage names that appear in `encoding` /
# learning rules are used as role labels downstream.
#
# ODOUR PATHWAY (release 783). This config drives the pathway the connectome
# actually carries: words are odor identities encoded onto the olfactory
# projection neurons (cell_class ALPN), which synapse densely onto Kenyon cells
# in the mushroom body (cell_class Kenyon_Cell); the Kenyon cells drive MBON
# output neurons, and DAN dopamine neurons supply the teaching signal.
# Measured connectivity (edges / synapses):
#   ALPN -> Kenyon_Cell          28144 / 329394
#   Kenyon_Cell -> MBON          89315 / 256719
#   DAN   -> Kenyon_Cell         49616 /  60657
#   Kenyon_Cell -> Kenyon_Cell        (recurrent, 326685 edges)
# Unlike the visual chain, no synthetic bridge or readout is required.
subcircuit:
  candidate: medium
  stages:
    - name: olfactory
      rules:
        - {column: cell_class, equals: ALPN}
      cap: 685
    - name: mushroom_body
      rules:
        - {column: cell_class, equals: Kenyon_Cell}
      cap: 384
    # DAN dopamine neurons supply the teaching signal, placed between the
    # mushroom body and the readout so the output stage is still selected
    # directly after the Kenyon cells (see `balance_outputs` below).
    - name: reinforcement
      rules:
        - {column: cell_class, equals: DAN}
      cap: 4
    - name: output
      rules:
        - {column: cell_class, equals: MBON}
      cap: 4
  # Exclude neurons flagged as segmentation or biology outliers.
  exclude_outliers: true
  # Backward seeding was added for the VISUAL chain, where the optic-lobe
  # links break under forward ranking (the medulla neurons chosen by input
  # strength project to none of the top-ranked lobula candidates, so the lobula
  # reached the end with zero in-edges and the synthetic bridge carried no
  # signal; the manifest's own reachability block reported
  # `signal_reaches_outputs: false`). The odor pathway here is dense
  # feedforward (ALPN -> KC, KC -> MBON), so forward ranking by the synapses
  # each candidate RECEIVES from the previously selected stages suffices.
  selection:
    # Empty: no backward seeding. Kept as a list so the visual default remains
    # reproducible as a config-only alternative.
    backward_chain: []
    # Choose the output neurons so their incoming mushroom_body drive is
    # comparable. Ranking them by input strength alone selects the most
    # strongly driven MBON neurons, which on release 783 produced a 248:1
    # spread in total plastic drive; one neuron then won every argmax, every
    # trial was punished, and dopamine decayed all weights uniformly. The
    # edges stay real; only which real readouts are used changes.
    balance_outputs: true
    # A readout with a single plastic synapse saturates on one presynaptic
    # spike, so it can only ever win or never fire. Require a workable
    # minimum of mushroom_body input before balancing.
    min_plastic_input: 3
    # Cap on how much Kenyon-cell input two readouts may share. Two MBON
    # neurons fed by the same Kenyon cells can never respond differently; a
    # balance-only rule selected such a pair (Jaccard 1.00) and left the
    # output flat for every word. Only the choice among real MBON neurons
    # changes; no edge is synthesised.
    max_readout_overlap: 0.5
  # Restrict the subcircuit to one hemisphere to halve the size. "" disables.
  restrict_side: ""
  # Max path length (in hops) used to verify input -> output reachability.
  max_path_hops: 8
  # ARTIFICIAL COMPONENT (visual chain only). The mushroom body receives no
  # optic-lobe input in FlyWire release 783 (measured: 1 synapse from lobula,
  # 2 from medulla), because it is not a visual target in Drosophila. The
  # visual default synthesises a lobula -> Kenyon-cell bridge backed by real
  # upstream strength. The odor pathway below needs NO bridge: ALPN -> Kenyon
  # cell is the densest feed-forward connection in the release, so these
  # synthetic sets are all disabled here and every edge in this subcircuit is
  # real FlyWire connectivity.
  #
  # Any synthetic set is NOT FlyWire connectivity and must never be reported as
  # such: it is flagged `artificial` on every edge, counted in the manifest,
  # and printed in the report.
  bridge:
    enabled: false
    # Synapses each Kenyon cell receives from the bridge. Kept small and sparse
    # so the bridge cannot bypass the optic-lobe computation.
    synapses_per_kc: 6
    # Only the top-N lobula neurons by real upstream strength may bridge.
    max_sources: 192
    # Synthetic sign of bridge synapses.
    sign: 1
    # Seed for the per-Kenyon-cell sparse source draw. Recorded in the run
    # manifest so any run can be reproduced exactly.
    seed: 20240917
    # Weight applied to bridge synapses before the global calibration scale.
    weight: 1.0
  # SYNTHETIC dense mushroom_body -> output readout (visual chain only).
  # The visual-chain subcircuit had too few real KC -> MBON edges for a usable
  # readout, so a dense seeded set closed the gap. Here the real KC -> MBON
  # pathway is dense (89,315 edges / 256,719 synapses), so this is disabled and
  # every readout edge is real.
  readout:
    enabled: false
    # Kenyon cells projecting to each output neuron, drawn without replacement
    # per output neuron from the selected Kenyon cells.
    sources_per_output: 12
    # Synthetic sign of readout synapses.
    sign: 1
    # Synapses per source -> output pair.
    weight: 1.0
    # Seed for the per-output-neuron source draw.
    seed: 20240918

network:
  # Number of output neurons. Must equal encoding.n_categories.
  n_outputs: 4
  # SYNTHETIC direct word -> mushroom_body input (VISUAL chain fallback).
  #
  # Measured on the visual chain: the word signal is decodable at the
  # photoreceptors (~0.50, 5-fold CV, chance 0.25) but is destroyed by the
  # optic lobe and never reaches the mushroom body (MB ~0.20). When this flag
  # is set the word is projected directly onto the Kenyon cells as a fixed,
  # seeded, non-negative random feature map of the ink image, bypassing the
  # optic lobe. This is declared synthetic and recorded in the manifest; it
  # does not change any measured FlyWire edge. It is OFF here: the odor
  # pathway drives its input stage through real ALPN -> Kenyon-cell synapses,
  # which need no synthetic projection.
  direct_input:
    enabled: false
    # Seed for the fixed image -> Kenyon-cell projection matrix.
    seed: 20240919
    # Multiplier on the projected current. Tuned so the Kenyon cells run in a
    # graded regime rather than saturating or staying silent.
    gain: 1.0
  # Reserve pool of neurons born silent and unconnected (see structural spec).
  # The reserve is the hard cap on how many neurons recruitment may add;
  # 1,000 is roughly half the 1,928-neuron pathway.
  reserve_size: 1000
  # Populations used as templates/recruitment targets, by role.
  lif:
    tau_ms: 20.0
    # Synaptic current decay. Required: without a decay equation on I_syn the
    # synaptic current integrates without bound and pins every neuron
    # hyperpolarized, so the network can never fire.
    tau_syn_ms: 5.0
    v_threshold: 1.0
    v_reset: 0.0
    v_rest: 0.0
    refractory_ms: 2.0
    t_init_ms: 50.0
  # SYNTHETIC. Each synapse carries a release probability `u` that starts at 1,
  # is decremented by `use` on every presynaptic spike, and recovers toward 1
  # with time constant `tau_ms`; the delivered current is w * u. Without it the
  # network is bistable -- silent below weight_scale ~1, and above ~2 it latches
  # into a fixed attractor that ignores the input. Measured with it disabled,
  # all 20 held-out words produced the bit-identical output vector [46,4,32,5].
  # FlyWire synapse counts carry no short-term plasticity, so this is declared
  # as synthetic and recorded in every run manifest rather than presented as
  # measured wiring.
  short_term_depression:
    # Implemented and available, but OFF by default because it measurably HURTS
    # the thing it was added to fix: with it on, lamina word-discrimination fell
    # from 8-9 distinct response patterns to 1-3. The bistability it was meant
    # to break is instead handled by the per-pair weight ratios above.
    enabled: false
    tau_ms: 50.0
    use: 0.3
    floor: 0.15
  # SYNTHETIC. Multiplier applied to `weight_scale` for the artificial
  # lobula -> mushroom_body bridge only. The bridge is not measured wiring, so
  # its strength is a declared free parameter. It is decoupled from the visual
  # chain because the chain needs a far larger `weight_scale` than the bridge
  # tolerates: at a shared scale the bridge saturates the mushroom body
  # (~3471 spikes per 300 ms word), which drives `reinforcement` hard, and the
  # 7-of-8 inhibitory reinforcement -> output edges then clamp the readout
  # completely silent.
  artificial_bridge:
    weight_ratio: 0.002
  artificial_readout:
  # Weight ratio for the mushroom_body -> output pair. In the VISUAL chain this
  # was a synthetic dense readout that needed its own scale (kept at 8.0
  # there); the special case matches the role names ("mushroom_body" ->
  # "output"), so a value equal to 1.0 here makes the pair use the plain
  # `weight_scale` exactly as every other real pair does.
  #
  # MEASURED in the visual chain through the real pipeline the plain scale left
  # the paired output mostly silent and every condition at chance; that is
  # exactly why this config drove the task onto the real olfactory pathway
  # instead (see docs/final-report.md). The odor path's KC -> MBON drive is
  # dense real connectivity (256,719 synapses), so the readout does not need
  # synthetic gain.
    weight_ratio: 1.0
  # A self-excitatory loop inside the output stage latches the readout: the
  # visual-chain outputs measured ~122 spikes per 300 ms word with sd 0.0-0.5,
  # insensitive to the stimulus, so one neuron won all 20 held-out words. A
  # self-exciting measurement device cannot report its own input. MBON -> MBON
  # edges exist in the release too, so this stays disabled in the odor path
  # until the readout is measured.
  output_recurrent:
    weight_ratio: 0.0
  # Measured runaway in the visual chain: all 116 mushroom_body -> mushroom_body
  # edges are excitatory and the compartment saturated at ~3500 spikes per
  # 300 ms word regardless of drive. The odor subcircuit retains FAR more
  # real recurrent KC -> KC connectivity (326,685 edges), so the same limit is
  # applied until the mushroom body is measured in the new network: a
  # self-exciting compartment that runs away carries no information about its
  # input.
  mushroom_body_recurrent:
    weight_ratio: 0.0001
  # Input drive current per unit firing rate, in nA.
  input_gain_na: 0.002
  # Baseline input current for the input stage, in nA.
  input_baseline_na: 0.0
  # Poisson background drive. A deterministic feedforward LIF chain is exactly
  # quiescent without a stimulus, so spontaneous firing needs an explicit
  # source. This is DECLARED NOISE, not measured FlyWire connectivity.
  noise:
    enabled: true
    rate_hz: 20.0
    weight: 0.9
    # SYNTHETIC per-stage scaling of the background noise weight. The
    # spontaneous Poisson drive that keeps the chain firing also swamps weak
    # feed-forward drive deep in the chain: at full weight a stage measures its
    # own noise rather than the input it is supposed to report (the same
    # failure mode as output self-excitation). Keys are stage role names;
    # unlisted stages keep the global weight. 1.0 leaves the stage unchanged,
    # 0.0 removes its noise.
    stage_weight_ratio:
      olfactory: 1.0
      mushroom_body: 1.0
      reinforcement: 1.0
      # The output-stage Poisson drive scales the whole network's noise by this
      # per-stage ratio. At 1.0 the outputs are dominated by their own noise
      # rather than the readout weights. Dropped to 0.1 so the weights govern
      # output firing. NOTE: in the visual chain this left the output stage
      # mostly SILENT under calibration's accepted noise (no-response 0.42-0.65,
      # every condition at chance -- see runs/run-20261008T204756Z); the odor
      # path's real dense KC -> MBON drive is the intended fix.
      output: 0.1
  # Subthreshold background drive for every neuron, in the same units as
  # v_threshold (1.0). A deterministic LIF network at rest is exactly silent,
  # so calibration's nonzero lower rate bound can never be met without it.
  # Keep it below v_threshold: spontaneous activity should arise from real
  # recurrent connectivity, not from injected noise.
  background_dc_na: 0.0
  # Generic per-stage-pair gain, keyed "<pre>><post>", applied on top of any
  # special-cased pair. MEASURED on the odor pathway: the KC -> MBON readout is
  # driven through real synapses at the plain `weight_scale` and stays ALMOST
  # SILENT (probe #3: 0.5 output spikes/trial, 77.5% no-response at 0.50
  # untrained KC decode), because only ~184 real edges reach the 4 selected
  # outputs. A multiplier here scales those real synapses (no edge is created
  # or deleted) and is the intended readout-drive knob; it is tuned by probe
  # and recorded in every manifest.
  pair_gain:
    # MEASURED readout-drive value (probe #4 sweep, untrained, single seed):
    #   1  -> 0.50 output spikes/trial, 77.5% no-response (decode floor)
    #   10 -> 3.69 /trial, 2.5% no-response, decode 0.250 (chance)
    #   30 -> 40.6 /trial, 0% no-response, decode 0.150
    #   100-> 188.8/trial, 0% no-response, decode 0.250
    #   300-> 390.0/trial, 0% no-response, decode 0.200
    # Higher gains only saturate the raw counts; 10 is the smallest value that
    # wakes the real KC -> MBON readout out of its silent floor.
    mushroom_body>output: 10.0
  # How raw synapse counts become synaptic weights. Raw counts are not
  # comparable across stage pairs: mushroom_body -> reinforcement averages 29
  # synapses per edge, reinforcement -> mushroom_body averages 0.5, so that
  # single excitatory feedback loop is ~58x stronger than its return path. The
  # network is then bistable (exactly 0 Hz below threshold, 125-440 Hz above)
  # and NO weight scale can reach the calibration band. Normalising by each
  # pair's mean synapse count makes `weight_scale` mean the same thing
  # everywhere, so loop gain follows edge counts instead of synapse counts.
  pair_weight_normalisation: fan_in_total
  # Reward signal injected into the real reinforcement stage. The reward VALUE
  # is synthetic; the neurons receiving it (here the DAN class, previously
  # APL/DPM in the visual chain) and their real synapses onto Kenyon cells are
  # genuine FlyWire neurons and connections.
  reward_gain_na: 120.0
  punishment_gain_na: 120.0
  # Time constant of the injected reward current, in ms.
  reward_tau_ms: 120.0

# Calibration (no external stimulus). The global weight scale is searched so
# spontaneous firing sits inside the acceptable band without saturating.
#
# MEASURED REGIME (release 783, visual chain, medium candidate, 1928 neurons):
# the network is bistable in drive alone. With background_dc=0 the spontaneous
# rate is set jointly by noise weight and weight scale, and the in-band
# stationary operating points all sit at noise 2.5-4.0 with weight scale 3-6:
#   noise 4.0, scale 4.0 -> 6.3-6.8 Hz, cont 0.002-0.006, drift 0.2-2.0
#   (verified stationary over 20+ s on seeds 1000-1003)
# Larger scales (>=7) run away past 15 Hz; scale <=3 is silent. The old grid
# started at scale 10 with noise <=5, i.e. entirely outside this regime, so
# every one of its 360 candidates was rejected. Grid order is search order:
# dc is the outer loop, noise the middle, scale the inner, so the first
# accept wins -- keep the known-good region early. The odor subcircuit has a
# different size and recurrent set, so its calibrated point is re-measured by
# the same search; the values above are the visual chain's measured regime.
calibration:
  enabled: true
  # Global multiplier searched over `scale_grid`. Small scales first: the
  # in-band stationary region measured above is scale 3-6, and the larger
  # values are kept only as fallbacks for other candidates/noise settings.
  scale_grid: [4.0, 3.0, 5.0, 6.0, 7.0, 8.0, 10.0, 25.0, 50.0, 100.0, 200.0, 350.0, 500.0, 700.0, 1000.0, 1500.0]
  # A candidate is rejected unless its strongest edge can drive a postsynaptic
  # neuron from a single spike, which for this cell means an edge of at least
  # 6.35 nA (see network.transmission_weight). Without this, the 0.5-15 Hz band
  # is satisfied by a silent network: in the visual chain the photoreceptors
  # fired at 136 Hz while the lamina below them reached 0.7 Hz and no
  # downstream stage fired at all.
  # Drive parameters searched jointly with `scale_grid`. An empty list means
  # "use the value from `network` unchanged". These are searched because with
  # the LIF sign convention corrected the network is bistable in `scale_grid`
  # alone: `background_dc_na` sets how far below threshold every population
  # sits, and the injected noise weight sets the resulting spontaneous rate.
  # Without them no scale lands in the 0.5-15 Hz band, because the transition
  # from fully silent to saturated happens inside one grid step.
  # `background_dc_grid` and `noise_weight_grid` are in CURRENT units (not
  # multiplied by weight_scale): noise weight 0.9 nA at 20 Hz sits far below
  # the ~50 nA sustained drive a LIF cell needs, so sub-1 noise weights can
  # never fire and are kept only to document the silent corner. The measured
  # in-band region needs noise 2.5-4.0.
  background_dc_grid: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
  noise_weight_grid: [4.0, 3.0, 2.5, 5.0, 2.0, 1.0, 0.5, 0.0]
  # The window must cover the initial ramp: at noise 2.5-4.0 the rate takes
  # ~0.3-1 s to reach its plateau, and a 300 ms window samples only the
  # onset (measured 0.27 Hz where the plateau is 5.9 Hz). 1000 ms of
  # measurement after a 500 ms settle lands on the plateau.
  simulated_ms: 1500.0
  # Settling time excluded from the measurement, in ms.
  settle_ms: 500.0
  min_mean_rate_hz: 0.5
  max_mean_rate_hz: 15.0
  # Fraction of neurons allowed to fire continuously (>= 1 spike per tau).
  max_continuous_fraction: 0.02
  # Reject scales whose drift exceeds this, in Hz. Drift compares the mean
  # rate of the SAME neurons in the two consecutive halves of the measurement
  # window (network.measure_spontaneous_activity).
  max_rate_drift_hz: 5.0

encoding:
  # Mapping scheme id, recorded in the manifest.
  #
  #   grid-v1 : render each word to an image and pool its darkness onto a
  #             photoreceptor grid (the original visual task; weights tune the
  #             optic-lobe chain and are unused by odor-v1).
  #   odor-v1 : words are arbitrary odor identities; each word drives a
  #             deterministic sparse pattern over the olfactory input stage.
  scheme_id: odor-v1
  # Pixel grid the rendered word is resampled onto (grid-v1 only). Must match
  # the number of simulated photoreceptors in the visual config, or the loader
  # will error.
  grid_rows: 24
  grid_cols: 24
  # odor-v1 parameters. Words are encoded as deterministic sparse patterns on
  # the olfactory input stage (cell_class ALPN): `n_inputs` must equal the
  # `subcircuit` olfactory cap so the mapping drives every simulated input.
  # Each CATEGORY owns a fixed, seeded, disjoint prototype subset of the
  # inputs; a word of that category activates `active_from_own` receptors from
  # its category prototype plus `active_elsewhere` cross-category receptors,
  # all at graded drive from [min_drive, max_drive] (0.0 = silent). The
  # category overlap is the point: it makes the class structure exist in the
  # stimulus itself (similar odours share receptor subsets, as in the real
  # antenna) so the real ALPN -> Kenyon-cell projection and the plastic
  # readout have something learnable to carry.
  odor:
    n_inputs: 685
    active_from_own: 64
    active_elsewhere: 4
    min_drive: 0.35
    max_drive: 1.0
  # Bundled font, relative to the package assets directory. Its sha256 is
  # recorded in the manifest and checked when `verify_font` is true.
  font_file: DejaVuSansMono.ttf
  font_sha256: 602ec86b8948cfcd956482fe64f94c36c867770149ef2f791d4613f443bcecb3
  verify_font: true
  font_size_px: 64
  letter_spacing_px: 8
  image_size_px: [128, 128]
  # Learning target.
  #
  # `category` is the semantic axis (animal / food / tool / place). In the
  # visual chain this was MEASURED TO BE UNLEARNABLE from rendered words:
  # supervised logistic regression on 60 training words scored 0.20-0.35 on 20
  # held-out words (chance 0.25) at 6x6, 16x16 and 32x32, and nearest-centroid
  # scored 0.100 -- words in a category are no more visually alike than words
  # across categories, so the structure is absent from the stimulus itself.
  #
  # In the ODOUR path (this config) the words are arbitrary odor identities
  # and `category` IS the learning target: each word gets its own deterministic
  # pattern on the olfactory inputs, and the network must group those patterns
  # by category at the readout. The label is the fixed class assignment, so
  # `category` is the meaningful mode here.
  #
  # `ink_quartile` (visual-chain mode) labels each word by total ink (label 0
  # lightest quarter, label 3 darkest), so it requires spatial integration and
  # the same regression scores 0.50-0.70 held-out at every resolution tried.
  label_mode: category
  # Darkness -> firing rate. rate_hz = baseline_hz + span_hz * darkness.
  #
  # baseline_hz MUST be 0: any positive baseline rate is converted to a current
  # by inverting the LIF rate-current relation, and 2 Hz maps to exactly the
  # threshold current (50 nA, since v_inf = I*tau_mem = 1.0 = v_threshold).
  # Every blank pixel therefore sat precisely at threshold and the retina
  # responded almost identically to every word (329-334 spikes, between-word
  # std ~1) in the visual chain. With baseline_hz = 0 a blank input is silent,
  # and the odor-v1 pattern maps to the same graded rate range.
  baseline_hz: 0.0
  max_hz: 120.0
  # Encoded rates are converted to input current by inverting the LIF
  # rate-current relation for the configured cell (see encoding.rate_to_current),
  # so no fixed nA/Hz gain is needed. The old scalar gain of 0.002 nA/Hz was
  # roughly 600x too weak to bring an input neuron to threshold.
  # Presentation timing, in ms.
  stimulus_ms: 300.0
  rest_ms: 200.0
  # Randomly permute pixel->photoreceptor assignments (grid-v1 control only).
  shuffle_pixels: false
  # Seed for the permutation; defaults to the run seed when null.
  shuffle_seed: null
  # Category labels, in the fixed order used for output neuron indices.
  categories: [animal, food, tool, place]

learning:
  # Dopamine-gated three-factor rule at Kenyon cell -> output synapses.
  enabled: true
  learning_rate: 0.02
  # Eligibility trace: increases on pre/post coincidence, decays with tau.
  trace_tau_ms: 400.0
  # Trace gain per coincident pre/post pair event.
  trace_increment: 0.02
  # Reward/punishment magnitudes delivered after each trial.
  reward: 1.0
  punishment: -1.0
  # Reward-prediction-error baseline. The three-factor signal is delivered
  # globally, so with a 4-way readout it carries a large punishment surplus at
  # chance (~75% of trials wrong): even a stable learning rule then drifts every
  # weight down regardless of the outcome. Subtracting a running average of the
  # reward centers the signal on the prediction error (reward - expected), which
  # is what biological dopamine neurons encode and which makes both potentiation
  # and depression possible trial to trial.
  reward_baseline: true
  baseline_rate: 0.02
  # Credit assignment: how one trial's outcome maps onto the readout synapses.
  #
  #   global    : one scalar dopamine sign applied to EVERY mushroom_body ->
  #               output synapse. At 4-way chance (~75% of trials wrong) the
  #               punishment surplus depresses the whole readout uniformly and
  #               never reinforces the target the network should have chosen,
  #               so training drifted accuracy DOWN (0.325 untrained -> 0.225
  #               trained) instead of up.
  #   per_class : the scalar is replaced by a per-output valence vector. On a
  #               wrong choice the CHOSEN (wrong) readout is punished while the
  #               TRUE readout is rewarded on the same trial -- a
  #               perceptron-style correction that carries which-class
  #               information the global scalar cannot express. Still gated by
  #               the real APL/DPM reinforcement-neuron spike gate.
  credit_assignment: per_class
  # Supervised readout pretraining. The three-factor rule alone does not beat
  # chance on this subcircuit because the Kenyon-cell drive to the readout is
  # weak and dominated by the spontaneous noise needed to make the LIF network
  # fire at all. When enabled, a multinomial logistic regression is fit on the
  # per-Kenyon-cell spike counts of the training words and its coefficients
  # initialise the plastic mushroom_body -> output weights (respecting each
  # synapse's fixed sign); the dopamine rule then fine-tunes from that
  # informative starting point. Only the plastic set is touched.
  pretrain: false
  pretrain_iters: 3000
  pretrain_lr: 0.5
  pretrain_l2: 0.01
  w_min: 0.0
  w_max: 1.0
  # Bounds are applied as RATIOS of the initial plastic weight, not as
  # absolute values. The plastic mushroom_body -> output synapse is initialised
  # to `weight_scale` (measured 500 in the calibrated operating regime), so
  # absolute bounds of 0..1 clipped the readout drive down ~500x on the first
  # dopamine update and left the range far too weak to matter. Set
  # `relative_bounds: false` to use w_min/w_max above instead.
  relative_bounds: true
  w_min_ratio: 0.0
  w_max_ratio: 2.0
  # Only these pathways are plastic.
  plastic_roles: [mushroom_body_output]
  # Synapse-level weight noise, dimensionless.
  weight_noise: 0.0

structural:
  # Master ablation switch.
  enabled: true
  # Run the structural step every N trials.
  check_every_n_trials: 25
  # Pruning: weight below threshold for N consecutive checks.
  prune_weight_threshold: 0.01
  prune_consecutive_checks: 2
  # Prune a recruited-reserve synapse when its magnitude falls below this
  # fraction of its own initial value. Scale-independent, unlike the absolute
  # threshold above.
  prune_weight_ratio: 0.1
  # Deletion target: reserve synapses pruned per recruited neuron. 0.5 makes
  # deletions track half of additions; a recruited neuron whose input synapses
  # are pruned is effectively deleted.
  prune_per_recruit: 0.5
  # Silencing: mean rate below threshold (Hz) over a window of trials.
  silence_rate_threshold_hz: 0.1
  silence_window_trials: 50
  # Recruitment: how often to attempt growth. New neurons are not clones of
  # a template: each grows "adjacent to" the most successful readout unit (the
  # output with the highest rolling winner-conditional reward), inheriting its
  # category but drawing pseudo-randomized presynaptic sources with >80%
  # divergence from that unit's current inputs, and bootstrapping at the
  # population-average gain. No two recruits share an identical input set.
  # Every check recruits; 4 checks x 50 = 200 recruits (~10.4% of 1,928),
  # matching the >10% cell-count increment rule.
  #
  # MEASURED: `1` (recruit at every check) exhausts the reserve fast (1000
  # recruits over 600 trials) and recruits never mature, holding structural_on
  # around 0.45-0.48. `4` (recruit every 4 checks = every 100 trials) gives
  # each cohort a survival + retention window; the matured 300-recruit run
  # reached 0.517 on the growth harness. Chosen direction: slow recruitment.
  recruit_every_n_checks: 4
  recruit_noise: 0.05
  recruitment:
    # Minimum fraction of a new neuron's sources that differ from its anchor's.
    # Set >0.80 per the experiment rule.
    divergence: 0.85
    # Anchor = readout unit in the top fraction of the rolling reward ranking.
    anchor_top_fraction: 0.25
    # Rolling winner-conditional reward window in trials.
    success_window: 200
    # Guarantee no two recruits ever share an identical input set.
    enforce_unique_inputs: true
    # Initial synaptic gain: "average" averages the population mean over the
    # recruit's fan-in. Tune here or with recruit_noise.
    gain: average
    # Deletions track additions even for reserve synapses above the weight
    # threshold: each interval the weakest active reserve synapses are retired
    # to reach floor(prune_per_recruit x recruited).
    force_retire: true
    # Intervals a recruit must survive before it may be retired, so newly
    # added neurons get a training window before deletion is possible.
    retirement_min_age: 1
  # Rate limits.
  max_prunes_per_interval: 64
  max_silences_per_interval: 8
  max_recruits_per_interval: 50
  # Total fraction of the plastic pathway that may be pruned or silenced.
  max_total_fraction_pruned: 0.5
  max_total_fraction_silenced: 0.25
  # Roles eligible for structural change.
  plasticity_roles: [mushroom_body, output]

evaluation:
  # Train/test split per category, out of 20 words each.
  train_per_category: 15
  test_per_category: 5
  # Conditions reported in the final table.
  conditions:
    - untrained
    - trained
    - shuffled_labels
    - dopamine_off
    # shuffled_pixels is a grid-v1 (visual) control only; it is meaningless
    # for odor-v1 inputs, whose pattern is the identity itself, so it is not
    # listed here.
    - structural_on
    - structural_off
  chance_level: 0.25
  # How a per-trial spike-count readout vector becomes a category decision.
  #   argmax : winner-take-most over the four output-neuron counts. On this
  #            subcircuit the outputs are noise-driven, so raw argmax sits at
  #            chance.
  #   linear : a multinomial logistic decoder fit on the TRAINING trials'
  #            count vectors and applied to the held-out count vectors. This is
  #            a supervised readout: it recovers the ~0.34 class signal that the
  #            readout-drive tuning in network.artificial_readout measured with
  #            nested CV, by correcting the per-output firing biases argmax
  #            cannot. The decoder is refit per condition from that condition's
  #            own training outputs, so untrained/trained/dopamine_off remain a
  #            fair comparison of the representation each condition produces.
  readout: linear
  # Training-set readout vectors used to fit the linear decoder, counted back
  # from the end of training (the post-plasticity representation).
  decoder_window: 200
  decoder_iters: 3000
  decoder_lr: 0.5
  decoder_l2: 0.1
  # Number of independent seeds. Minimum 10 per the evaluation spec.
  n_seeds: 10
  base_seed: 1000
  # Two-sided significance level for the one-sample test against chance.
  significance_level: 0.01
  # Bootstrap resamples for the confidence interval.
  ci_resamples: 10000
  ci_level: 0.95
  # Training trials per seed.
  n_train_trials: 600
  # Trials per learning-curve window.
  curve_window_trials: 50
  # Held-out evaluation repetitions per word, to reduce response noise.
  eval_repeats: 3
  # Raise a data-leakage warning when shuffled labels beat chance by this much.
  leakage_margin: 0.05

benchmark:
  # Task 0 feasibility gate.
  simulated_ms: 500.0
  settle_ms: 50.0
  # Wall-clock budget for the whole multi-seed experiment, in minutes.
  wall_clock_limit_min: 120.0
  # Fail the gate if peak memory exceeds this fraction of the memory budget.
  memory_headroom: 0.8

resources:
  # Hard memory budget for loading + building the subcircuit, in MB.
  memory_budget_mb: 4096